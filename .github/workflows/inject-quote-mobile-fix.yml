name: Inject quote mobile fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile fix script to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./quote-mobile-fix.js"></script>'
          if tag not in s:
              needle='<script src="./camera-catalog.js"></script>'
              if needle not in s:
                  raise SystemExit('camera-catalog.js script tag not found')
              s=s.replace(needle, tag+'\n'+needle, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'fix: enable mobile quote item editing'
            git push
          fi
