name: Attach print fix

on:
  push:
    branches: [main]
    paths:
      - 'print-fix.js'
      - '.github/workflows/attach-print-fix.yml'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach print-fix.js to index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./print-fix.js"></script>'
          if tag not in s:
              needle='<script src="./preserve-page.js"></script>'
              if needle not in s:
                  needle='<script src="./quote-mobile-fix.js"></script>'
              if needle not in s:
                  raise SystemExit('Uygun script ekleme noktası bulunamadı')
              s=s.replace(needle, needle+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit attachment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Already attached.'
            exit 0
          fi
          git commit -m 'Attach print isolation fix'
          git push
