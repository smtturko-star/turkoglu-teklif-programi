name: Ensure Supabase browser SDK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure blocking Supabase UMD fallbacks
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          new = ('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>'
                 '<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>')
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No SDK patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix Supabase browser SDK loading"
          git push