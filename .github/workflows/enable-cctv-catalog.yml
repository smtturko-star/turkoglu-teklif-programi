name: Enable CCTV catalog scripts

on:
  push:
    paths:
      - '.github/workflows/enable-cctv-catalog.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load CCTV catalog scripts
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- TURKOGLU_CCTV_CATALOG_SCRIPTS -->'
          if marker in s:
              print('CCTV katalog scriptleri zaten bağlı.')
              raise SystemExit(0)
          needle = '</head>'
          patch = '''<!-- TURKOGLU_CCTV_CATALOG_SCRIPTS -->
          <script src="camera-catalog.js"></script>
          <script src="camera-details.js"></script>
          '''
          if needle not in s:
              raise SystemExit('index.html kapanış head etiketi bulunamadı.')
          s = s.replace(needle, patch + needle, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit index update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Değişiklik yok.'
            exit 0
          fi
          git commit -m 'fix: CCTV katalog ve filtreleri etkinleştir'
          git push
