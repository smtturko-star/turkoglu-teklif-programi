name: Fix search bars and clean stray text

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove the accidental literal backslash-newline text and any old search injections.
          text = text.replace(r'\n\n\n', '')
          text = text.replace(r'\n\n', '')
          text = re.sub(r'\n<script id="turkoglu-search-js">[\s\S]*$', '\n', text)
          text = re.sub(r'\n\\n<!-- TURKOGLU_GLOBAL_SEARCH_V1 -->[\s\S]*$', '\n', text)
          text = re.sub(r'\n<!-- TURKOGLU_GLOBAL_SEARCH_V1 -->[\s\S]*$', '\n', text)

          css = '''
          <style id="turkoglu-search-css">
          .global-search{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
          .global-search-main{position:relative;flex:1;min-width:240px}
          .global-search-main input{padding-left:38px}
          .global-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none}
          .global-search-clear{background:#eef0f3!important;color:#111827!important}
          .global-search-count{font-size:12px;color:var(--muted);white-space:nowrap}
          @media(max-width:760px){.global-search-main{min-width:100%}}
          </style>
          '''
          if 'id="turkoglu-search-css"' not in text:
              text = text.replace('</head>', css + '\n</head>', 1)

          js = r'''
          (function(){
            const configs=[
              ['customers','customerRows','Müşteri, yetkili, telefon, e-posta veya adres ara...'],
              ['products','productRows','Ürün adı, marka, model veya kategori ara...'],
              ['quotes','quoteRows','Teklif no, müşteri veya durum ara...'],
              ['jobs','jobRows','Müşteri, iş/proje veya durum ara...'],
              ['payments','paymentRows','Müşteri, tarih, yöntem veya açıklama ara...']
            ];
            const norm=v=>String(v??'').toLocaleLowerCase('tr-TR');
            const state={customers:'',products:'',quotes:'',jobs:'',payments:'',quoteProducts:''};

            function applyRows(key,tbodyId){
              const body=document.getElementById(tbodyId); if(!body)return;
              const q=norm(state[key]).trim();
              let total=0,shown=0;
              [...body.querySelectorAll('tr')].forEach(tr=>{
                const cells=tr.children;
                if(!cells.length)return;
                total++;
                const empty=cells.length===1;
                const ok=!q || norm(tr.textContent).includes(q);
                tr.style.display=ok?'':'none';
                if(ok && !empty)shown++;
              });
              const c=document.getElementById('search-count-'+key);
              if(c)c.textContent=q ? shown+' / '+Math.max(0,total-(total-shown)) : 'Toplam '+shown;
            }

            function addTableBar(sectionId,tbodyId,placeholder,key){
              const section=document.getElementById(sectionId); if(!section)return;
              if(section.querySelector('[data-search-key="'+key+'"]'))return;
              const card=section.querySelector('.card'); const table=card?.querySelector('table'); if(!table)return;
              const bar=document.createElement('div');
              bar.className='global-search';
              bar.dataset.searchKey=key;
              bar.innerHTML='<div class="global-search-main"><span class="global-search-icon">🔎</span><input type="search" autocomplete="off" placeholder="'+placeholder+'"></div><span class="global-search-count" id="search-count-'+key+'">Toplam 0</span><button type="button" class="global-search-clear">Temizle</button>';
              table.parentNode.insertBefore(bar,table);
              const input=bar.querySelector('input');
              input.value=state[key];
              input.addEventListener('input',()=>{state[key]=input.value;applyRows(key,tbodyId)});
              bar.querySelector('.global-search-clear').addEventListener('click',()=>{state[key]='';input.value='';applyRows(key,tbodyId);input.focus()});
              const body=document.getElementById(tbodyId);
              if(body)new MutationObserver(()=>applyRows(key,tbodyId)).observe(body,{childList:true});
              applyRows(key,tbodyId);
            }

            function addQuoteProductBar(){
              const box=document.querySelector('#modalBox .products');
              if(!box || box.previousElementSibling?.dataset?.quoteProductSearch==='1')return;
              const bar=document.createElement('div');
              bar.className='global-search';
              bar.dataset.quoteProductSearch='1';
              bar.innerHTML='<div class="global-search-main"><span class="global-search-icon">🔎</span><input type="search" autocomplete="off" placeholder="Teklif için ürün ara: ad, marka, model veya kategori..."></div><button type="button" class="global-search-clear">Temizle</button>';
              box.parentNode.insertBefore(bar,box);
              const input=bar.querySelector('input');
              const apply=()=>{const q=norm(input.value).trim();box.querySelectorAll('.p').forEach(card=>card.style.display=(!q||norm(card.textContent).includes(q))?'':'none')};
              input.addEventListener('input',apply);
              bar.querySelector('.global-search-clear').addEventListener('click',()=>{input.value='';apply();input.focus()});
            }

            function install(){
              configs.forEach(c=>addTableBar(c[0],c[1],c[2],c[0]));
              addQuoteProductBar();
            }

            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
            const modal=document.getElementById('modalBox');
            if(modal)new MutationObserver(addQuoteProductBar).observe(modal,{childList:true,subtree:true});
          })();
          '''

          # Put the search code inside the existing application <script> block.
          marker='\nstart();'
          if marker not in text:
              raise SystemExit('start() marker not found')
          text=text.replace(marker,'\n'+js+'\nstart();',1)

          # Keep the document closed exactly once.
          text=re.sub(r'\n</body></html>\s*$', '\n</body></html>\n', text)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate HTML/JS structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          assert t.count('<html')==1
          assert t.count('</html>')==1
          assert t.count('<body>')==1
          assert t.count('</body>')==1
          assert t.count('<script id="turkoglu-search-js">')==0
          assert 'TURKOGLU_GLOBAL_SEARCH_V1' not in t
          assert 'turkoglu-search-css' in t
          assert 'Müşteri, yetkili, telefon' in t
          print('index.html validation OK')
          PY

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-search.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix search bars and remove stray text"
            git push
          fi
