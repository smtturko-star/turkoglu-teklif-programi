name: Apply camera product seed

on:
  push:
    branches: [main]
    paths:
      - 'scripts/seed-camera-products.py'
      - '.github/workflows/apply-camera-seed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index.html
        run: python scripts/seed-camera-products.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add common IP and HD camera products'
          git push
