name: Turkoglu Product Seed

on:
  push:
    paths:
      - '.github/workflows/turkoglu-product-seed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add common camera seed helper
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* TURKOGLU_COMMON_CAMERA_SEED */'
          if marker in s:
              print('Ürün seed kodu zaten mevcut.')
              raise SystemExit(0)
          needle='</script>\n</body>\n</html>'
          patch=r'''/* TURKOGLU_COMMON_CAMERA_SEED */
(function(){
  const commonCameras=[
    {name:'IP HD Dome Kamera 2MP',brand:'Avenir',model:'AV-IPD-2MP',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP Full HD IP dome kamera'},
    {name:'IP HD Bullet Kamera 2MP',brand:'Avenir',model:'AV-IPB-2MP',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP Full HD IP bullet kamera'},
    {name:'IP HD Dome Kamera 4MP',brand:'Avenir',model:'AV-IPD-4MP',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'4MP IP dome kamera'},
    {name:'IP HD Bullet Kamera 4MP',brand:'Avenir',model:'AV-IPB-4MP',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'4MP IP bullet kamera'},
    {name:'HD Dome Kamera 2MP',brand:'HiLook',model:'THC-T120-MS',category:'HD Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP Turbo HD dome kamera'},
    {name:'HD Bullet Kamera 2MP',brand:'HiLook',model:'THC-B120-MS',category:'HD Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP Turbo HD bullet kamera'},
    {name:'HD Dome Kamera 5MP',brand:'HiLook',model:'THC-T150',category:'HD Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'5MP Turbo HD dome kamera'},
    {name:'HD Bullet Kamera 5MP',brand:'HiLook',model:'THC-B150',category:'HD Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'5MP Turbo HD bullet kamera'},
    {name:'ColorVu IP Dome Kamera 2MP',brand:'Hikvision',model:'DS-2CD2T27G2',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP ColorVu IP kamera'},
    {name:'ColorVu IP Bullet Kamera 4MP',brand:'Hikvision',model:'DS-2CD2T47G2',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'4MP ColorVu IP kamera'},
    {name:'HD Dome Kamera 2MP',brand:'Hikvision',model:'DS-2CE56D0T-IRP',category:'HD Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP Turbo HD dome kamera'},
    {name:'HD Bullet Kamera 2MP',brand:'Hikvision',model:'DS-2CE16D0T-IRP',category:'HD Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP Turbo HD bullet kamera'},
    {name:'IP Dome Kamera 2MP',brand:'Dahua',model:'IPC-HDW1230',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP IP dome kamera'},
    {name:'IP Bullet Kamera 2MP',brand:'Dahua',model:'IPC-HFW1230',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'2MP IP bullet kamera'},
    {name:'IP Dome Kamera 4MP',brand:'Dahua',model:'IPC-HDW1430',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'4MP IP dome kamera'},
    {name:'IP Bullet Kamera 4MP',brand:'Dahua',model:'IPC-HFW1430',category:'IP Kamera',purchase_price:0,sale_price:0,vat_rate:20,stock:0,description:'4MP IP bullet kamera'}
  ];
  async function seed(){
    if(typeof client==='undefined'||typeof user==='undefined'||!client||!user)return false;
    const {data:existing,error}=await client.from('products').select('name,brand,model');
    if(error)return false;
    const keys=new Set((existing||[]).map(p=>String((p.brand||'')+'|'+(p.model||'')).toLowerCase()));
    const missing=commonCameras.filter(p=>!keys.has((p.brand+'|'+p.model).toLowerCase()));
    if(!missing.length)return true;
    const r=await client.from('products').insert(missing);
    if(!r.error && typeof loadAll==='function')await loadAll();
    return !r.error;
  }
  let tries=0; const timer=setInterval(async()=>{tries++;if(await seed()||tries>30)clearInterval(timer)},2000);
})();
'''
          if needle not in s:
              raise SystemExit('HTML kapanış hedefi bulunamadı; dosya değiştirilmedi.')
          s=s.replace(needle,patch+'\n'+needle,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Değişiklik yok.'; exit 0; fi
          git commit -m 'fix: ürün seed helper oturum kapsamını düzelt'
          git push
