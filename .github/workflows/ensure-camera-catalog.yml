name: Ensure camera catalog is loaded

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-camera-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure camera catalog script is referenced
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./camera-catalog.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html içinde </body> bulunamadı')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('camera-catalog.js index.html içine eklendi')
          else:
              print('camera-catalog.js zaten bağlı')

      - name: Commit injection if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'Değişiklik yok.'
          else
            git add index.html
            git commit -m 'fix: load camera catalog in app'
            git push
          fi
