name: Install stable search bars
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install-search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean broken search injection and install stable search UI
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove previous search injections that could print literal text or override app functions.
          s = re.sub(r'<style id="turkoglu-global-search">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="turkoglu-search-css">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'\s*<!-- TURKOGLU_GLOBAL_SEARCH_V1 -->\s*<script>.*?</script>\s*', '\n', s, flags=re.S)
          s = re.sub(r'<style id="turkoglu-stable-search">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<script id="turkoglu-stable-search-js">.*?</script>\s*', '', s, flags=re.S)

          # Remove only malformed trailing material that appeared after the real HTML document.
          end = s.lower().rfind('</html>')
          if end != -1:
              s = s[:end+7]

          css = '''
<style id="turkoglu-stable-search">
.searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.searchbar-main{position:relative;flex:1;min-width:240px}.searchbar-main input{padding-left:38px}.searchbar-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:18px;pointer-events:none}.searchbar-count{font-size:12px;color:var(--muted);white-space:nowrap}.searchbar-clear{background:#eef0f3!important;color:#111827!important;padding:8px 11px!important}@media(max-width:760px){.searchbar-main{min-width:100%}}
</style>
'''
          s = s.replace('</head>', css + '</head>', 1)

          hosts = {
            'customers': ('customerSearchHost', 'customerRows', 'Müşteri, yetkili, telefon, e-posta veya adres ara...'),
            'products': ('productSearchHost', 'productRows', 'Ürün adı, marka, model veya kategori ara...'),
            'quotes': ('quoteSearchHost', 'quoteRows', 'Teklif no, müşteri veya durum ara...'),
            'jobs': ('jobSearchHost', 'jobRows', 'Müşteri, iş/proje veya durum ara...'),
            'payments': ('paymentSearchHost', 'paymentRows', 'Müşteri, tarih, yöntem veya açıklama ara...'),
          }

          for section_id, (host_id, tbody_id, placeholder) in hosts.items():
              marker = f'<section id="{section_id}"'
              pos = s.find(marker)
              if pos == -1 or f'id="{host_id}"' in s[pos:s.find('</section>', pos)+10]:
                  continue
              table_pos = s.find('<table', pos)
              if table_pos == -1:
                  continue
              host = f'<div id="{host_id}" class="search-host" data-tbody="{tbody_id}" data-placeholder="{placeholder}"></div>\n'
              s = s[:table_pos] + host + s[table_pos:]

          js = '''
<script id="turkoglu-stable-search-js">
(function(){
  const cfg=[
    {host:'customerSearchHost',body:'customerRows',ph:'Müşteri, yetkili, telefon, e-posta veya adres ara...'},
    {host:'productSearchHost',body:'productRows',ph:'Ürün adı, marka, model veya kategori ara...'},
    {host:'quoteSearchHost',body:'quoteRows',ph:'Teklif no, müşteri veya durum ara...'},
    {host:'jobSearchHost',body:'jobRows',ph:'Müşteri, iş/proje veya durum ara...'},
    {host:'paymentSearchHost',body:'paymentRows',ph:'Müşteri, tarih, yöntem veya açıklama ara...'}
  ];
  const norm=v=>String(v||'').toLocaleLowerCase('tr-TR').trim();
  const realRows=body=>[...body.querySelectorAll('tr')].filter(r=>{const t=norm(r.textContent);return t&&t!=='iş yok.'&&t!=='ürün yok.'&&t!=='müşteri yok.'&&t!=='teklif yok.'&&t!=='ödeme yok.'});
  const apply=c=>{
    const host=document.getElementById(c.host),body=document.getElementById(c.body); if(!host||!body)return;
    const input=host.querySelector('input'); if(!input)return;
    const q=norm(input.value),rows=[...body.querySelectorAll('tr')],valid=realRows(body); let shown=0;
    rows.forEach(r=>{const ok=!q||norm(r.textContent).includes(q);r.style.display=ok?'':'none';if(ok&&valid.includes(r))shown++});
    const count=host.querySelector('.searchbar-count');if(count)count.textContent=`${shown} / ${valid.length}`;
  };
  const install=()=>cfg.forEach(c=>{
    const host=document.getElementById(c.host),body=document.getElementById(c.body); if(!host||!body)return;
    let input=host.querySelector('input');
    if(!input){
      host.innerHTML='<div class="searchbar"><div class="searchbar-main"><span class="searchbar-icon">⌕</span><input type="search" placeholder="'+c.ph+'" autocomplete="off"><button type="button" class="searchbar-clear" data-clear>Temizle</button></div><span class="searchbar-count"></span></div>';
      input=host.querySelector('input');
      input.addEventListener('input',()=>apply(c));
      host.querySelector('[data-clear]').addEventListener('click',()=>{input.value='';apply(c);input.focus()});
    }
    apply(c);
  });
  install();
  const mo=new MutationObserver(()=>install());
  cfg.forEach(c=>{const b=document.getElementById(c.body);if(b)mo.observe(b,{childList:true,subtree:true})});
  const pageObserver=new MutationObserver(()=>setTimeout(install,0));
  pageObserver.observe(document.body,{childList:true,subtree:true});

  // Search products inside the quote modal without replacing any existing application functions.
  const modalObserver=new MutationObserver(()=>{
    const box=document.getElementById('modalBox'); if(!box)return;
    const heading=[...box.querySelectorAll('h2,h3')].find(h=>norm(h.textContent).includes('ürünler')); if(!heading)return;
    const grid=[...box.querySelectorAll('.products')].find(x=>x.querySelector('.p')); if(!grid||box.querySelector('#quoteProductSearchStable'))return;
    const wrap=document.createElement('div');wrap.id='quoteProductSearchStable';wrap.className='searchbar';wrap.innerHTML='<div class="searchbar-main"><span class="searchbar-icon">⌕</span><input type="search" placeholder="Teklif için ürün ara..." autocomplete="off"><button type="button" class="searchbar-clear">Temizle</button></div><span class="searchbar-count"></span>';
    grid.parentNode.insertBefore(wrap,grid);
    const input=wrap.querySelector('input'),clear=wrap.querySelector('button'),count=wrap.querySelector('.searchbar-count');
    const apply=()=>{const q=norm(input.value),cards=[...grid.querySelectorAll('.p')];let n=0;cards.forEach(card=>{const ok=!q||norm(card.textContent).includes(q);card.style.display=ok?'':'none';if(ok)n++});count.textContent=`${n} / ${cards.length}`};
    input.addEventListener('input',apply);clear.addEventListener('click',()=>{input.value='';apply();input.focus()});apply();
  });
  const modal=document.getElementById('modalBox');if(modal)modalObserver.observe(modal,{childList:true,subtree:true});
})();
</script>
'''
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit stable search changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install stable search bars without breaking app"
            git push
          fi
